<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <h1>Log in</h1>
  <p class="sub">Enter your password to continue.</p>

  <form class="login" method="post">
    <label for="password" class="plabel">Password</label>

    <div class="pw-wrap">
      <input type="password" id="password" name="password" class="pw" autocomplete="current-password" autofocus required>
      <button type="button" class="pw-toggle" id="togglePw" aria-label="Show password" aria-pressed="false">Show</button>
    </div>

    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}

    <div class="bar">
      <button type="submit" class="primary">Log in</button>
    </div>
  </form>
</main>

<script>
  var input = document.getElementById('password');
  var toggle = document.getElementById('togglePw');

  toggle.addEventListener('click', function () {
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
    input.focus();
  });
</script>
</body>
</html>
